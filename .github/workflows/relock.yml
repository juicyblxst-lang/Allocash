name: Temporary relock automation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Execute permissionless relock caller
        env:
          RPC_URL: ${{ secrets.ALLOCASH_RPC_URL }}
          RELOCK_RELAYER_PRIVATE_KEY: ${{ secrets.ALLOCASH_RELOCK_RELAYER_PRIVATE_KEY }}
          ALLOCASH_VAULT_ADDRESSES: ${{ secrets.ALLOCASH_VAULT_ADDRESSES }}
          RELOCK_LOOKBACK_BLOCKS: '5000'
        run: pnpm --filter @allocash/automation run
